name: Update Profile Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stats

          write_badge () {
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$1" "$2" "$3" > "stats/$4"
            echo "$4: $2"
          }

          # Merged PRs, whole account (own repositories included)
          PRS=$(gh api "search/issues?q=author:lxcxjxhx+type:pr+is:merged&per_page=1" --jq '.total_count // 0')
          write_badge "merged PRs" "$PRS" "f38ba8" prs.json

          # Merged PRs into repositories I do not own -- the number the README quotes
          UP=$(gh api "search/issues?q=author:lxcxjxhx+type:pr+is:merged+-user:lxcxjxhx&per_page=1" --jq '.total_count // 0')
          write_badge "upstream merges" "$UP" "f38ba8" upstream.json

          # Public repositories
          REPOS=$(gh api users/lxcxjxhx --jq '.public_repos // 0')
          write_badge "repositories" "$REPOS" "D8C4E4" repos.json

          # Total stars across all repositories, every page
          STARS=$(gh api --paginate "users/lxcxjxhx/repos?per_page=100" --jq '.[].stargazers_count' | jq -s 'add // 0')
          write_badge "total stars" "$STARS" "94e2d5" stars.json

          # Followers
          FOLL=$(gh api users/lxcxjxhx --jq '.followers // 0')
          write_badge "followers" "$FOLL" "f9e2af" followers.json

          # Annual commits (calendar year, via public contributions API)
          YEAR=$(date -u '+%Y')
          COMMITS=$(curl -s "https://github-contributions-api.jogruber.de/v4/lxcxjxhx" \
            | jq -r --arg y "$YEAR" '[.contributions[]? | select(.date | startswith($y)) | .count] | add // 0')
          write_badge "commits this year" "$COMMITS" "7cd9e8" commits.json

          # Every badge must be a plain number before anything is injected
          for pair in "prs:$PRS" "upstream:$UP" "repos:$REPOS" "stars:$STARS" \
                      "followers:$FOLL" "commits:$COMMITS"; do
            key=${pair%%:*}
            value=${pair#*:}
            case "$value" in
              ''|*[!0-9]*) echo "::error::$key did not resolve to a number: '$value'"; exit 1 ;;
            esac
          done

      - name: Inject stats into SVG
        run: |
          echo "Injecting: PRS=$PRS REPOS=$REPOS STARS=$STARS FOLLOWERS=$FOLL COMMITS=$COMMITS"

          export PRS REPOS STARS FOLLOWERS COMMITS

          perl -i -pe 's/(<text id="stat-prs"[^>]*>)[^<]*(<\/text>)/$1$ENV{PRS}$2/g' profile-anim.svg
          perl -i -pe 's/(<text id="stat-repos"[^>]*>)[^<]*(<\/text>)/$1$ENV{REPOS}$2/g' profile-anim.svg
          perl -i -pe 's/(<text id="stat-stars"[^>]*>)[^<]*(<\/text>)/$1$ENV{STARS}$2/g' profile-anim.svg
          perl -i -pe 's/(<text id="stat-followers"[^>]*>)[^<]*(<\/text>)/$1$ENV{FOLLOWERS}$2/g' profile-anim.svg
          perl -i -pe 's/(<text id="stat-commits"[^>]*>)[^<]*(<\/text>)/$1$ENV{COMMITS}$2/g' profile-anim.svg

          # Every target must now hold a number; fail the build instead of shipping a blank badge
          for id in prs repos stars followers commits; do
            if ! grep -q "id=\"stat-$id\"[^>]*>[0-9]" profile-anim.svg; then
              echo "::error::stat-$id was not injected"
              exit 1
            fi
            grep -o "id=\"stat-$id\"[^>]*>[0-9]*" profile-anim.svg
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/ profile-anim.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats [skip ci]"
            git push --force-with-lease || {
              echo "Push rejected, rebasing on the newer main and retrying"
              git pull --rebase origin main
              git push --force-with-lease
            }
          fi
